name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify offline-only policy
        shell: bash
        run: |
          if grep -R -n -E '<uses-permission[^>]*android\.permission\.INTERNET' app/src/main; then
            echo "ERROR: INTERNET permission found."
            exit 1
          fi

          if grep -R -n -E 'firebase|retrofit|okhttp|google-services' \
            build.gradle.kts \
            app/build.gradle.kts \
            gradle/libs.versions.toml; then
            echo "ERROR: network/Firebase dependency found."
            exit 1
          fi

          echo "Offline-only policy passed."

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify and build ARM64 release APK
        run: ./gradlew --no-daemon lintRelease assembleRelease

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: HydraPush-release-arm64-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HydraPush-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
